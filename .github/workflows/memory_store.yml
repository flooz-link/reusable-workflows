name: Cloud Run Deployment Workflow

on:
  workflow_call:
    inputs:
      SERVICE:
        required: true
        type: string
      CLUSTER_NAME:
        required: true
        type: string
      ENV:
        required: true
        type: string
      WORK_DIR:
        required: true
        type: string
      REPLICA_COUNT:
        required: false
        type: number
        default: 0
      MEMORY:
        required: false
        type: number
        default: 5
        description: The memory amount in gigabytes for Redis, defaults to 5 as this is the minimum for replicated clusters.
      EVICTION_POLICY:
        required: false
        type: string
        default: "allkeys-lru"
        description: The Redis maxmemory eviction policy to use.
      SNAPSHOT_PERIOD:
        required: false
        type: string
        default: "1h"
        description: The period for taking snapshots (check https://cloud.google.com/sdk/gcloud/reference/redis/instances/create#--rdb-snapshot-period) defaults to 1h.
      REGION:
        required: false
        type: string
        default: us-central1

    secrets:
      SA_CREDENTIALS:
        required: true
        description: The Service Account that will be used to perform changes on GCP.
      PROJECT_ID:
        required: true
        description: The GCP project ID.

    outputs:
      read_url:
        description: Read URL of clustered memory store redis instance.
        value: ${{ jobs.provision-memory-store-cluster.outputs.read_url }}
      write_url:
        description: Write URL of clustered memory store redis instance if no replication is enabled read_url and write_url have the same value.
        value: ${{ jobs.provision-memory-store-cluster.outputs.write_url }}

jobs:
  provision-memory-store-cluster:
    defaults:
      run:
        working-directory: ${{inputs.WORK_DIR}}
    name: Provisioning ${{inputs.SERVICE}}
    runs-on: ubuntu-latest
    outputs:
      read_url: ${{ steps.deploy.outputs.read_url }}
      write_url: ${{ steps.deploy.outputs.write_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - id: 'auth'
        uses: 'google-github-actions/auth@v0'
        with:
          credentials_json: '${{ secrets.SA_CREDENTIALS }}'
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v0

      - name: Make sure jq in installed
        run: sudo apt-get install jq

      - name: Fix env vars
        run: |
          echo "SHORT_SHA=`echo ${GITHUB_SHA} | cut -c1-8`" >> $GITHUB_ENV

      - name: Provision Cluster
        id: deploy
        run: |-
          emptyResponse=$(echo "[]")
          output=$(gcloud redis instances list --filter="projects/${{ secrets.PROJECT_ID }}/locations/${{ inputs.REGION }}/instances/${{ inputs.CLUSTER_NAME }}" --format=json --region=${{ inputs.REGION }})

          if [ "$output" == "$emptyResponse" ]; then
            echo "Provisioning new MemoryStore cluster ${{ inputs.CLUSTER_NAME }}"
            if [ ${{ inputs.REPLICA_COUNT }} -eq 0 ]; then
              gcloud redis instances create ${{ inputs.CLUSTER_NAME }} \
              --tier=standard \
              --size=${{ inputs.MEMORY }} \
              --region=${{ inputs.REGION }} \
              --redis-version=redis_6_x \
              --network=default \
              --display-name=${{ inputs.CLUSTER_NAME }} \
              --rdb-snapshot-period=${{ inputs.SNAPSHOT_PERIOD }} \
              --connect-mode=direct-peering \
              --redis-config=maxmemory-policy=${{ inputs.EVICTION_POLICY }}
            else
              gcloud redis instances create ${{ inputs.CLUSTER_NAME }} \
              --tier=standard \
              --size=${{ inputs.MEMORY }} \
              --region=${{ inputs.REGION }} \
              --read-replicas-mode=READ_REPLICAS_ENABLED \
              --replica-count=${{ inputs.REPLICA_COUNT }} \
              --redis-version=redis_6_x \
              --network=default \
              --display-name=${{ inputs.CLUSTER_NAME }} \
              --rdb-snapshot-period=${{ inputs.SNAPSHOT_PERIOD }} \
              --connect-mode=direct-peering \
              --redis-config=maxmemory-policy=${{ inputs.EVICTION_POLICY }}
            fi
          else
            echo "Updating existing MemoryStore cluster ${{ inputs.CLUSTER_NAME }}"
          
            # Step 1: Update the common configurations that apply to all tiers.
            gcloud redis instances update ${{ inputs.CLUSTER_NAME }} -q --region=${{ inputs.REGION }} \
              --update-redis-config="maxmemory-policy=${{ inputs.EVICTION_POLICY }}" \
              --rdb-snapshot-period=${{ inputs.SNAPSHOT_PERIOD }} \
              --size=${{ inputs.MEMORY }}
          
            # Step 2: Intelligently update replicas ONLY if the instance is not a High Availability tier.
            instance_tier=$(echo $output | jq -r '.[0].tier')
            if [ "$instance_tier" != "STANDARD_HA" ]; then
              echo "Instance is STANDARD tier. Checking replica count..."
              # Only update if the replica count has actually changed.
              if [ ${{ inputs.REPLICA_COUNT }} -ne $(echo $output | jq -r '.[0].replicaCount') ]; then
                  gcloud redis instances update ${{ inputs.CLUSTER_NAME }} --region=${{ inputs.REGION }} \
                    --replica-count=${{ inputs.REPLICA_COUNT }}
              fi
            else
              echo "Instance is STANDARD_HA. Skipping replica count update."
            fi
          fi

          clusterDesc=$(gcloud redis instances describe ${{ inputs.CLUSTER_NAME }} --region=${{ inputs.REGION }} --format=json)

          if [ ${{ inputs.REPLICA_COUNT }} -eq 0 ]; then
            echo "read_url=$(echo $clusterDesc | jq -r '"\(.host):\(.port)"')" >> $GITHUB_OUTPUT
            echo "write_url=$(echo $clusterDesc | jq -r '"\(.host):\(.port)"')" >> $GITHUB_OUTPUT
          else
            echo "read_url=$(echo $clusterDesc | jq -r '"\(.readEndpoint):\(.readEndpointPort)"')" >> $GITHUB_OUTPUT
            echo "write_url=$(echo $clusterDesc | jq -r '"\(.host):\(.readEndpointPort)"')" >> $GITHUB_OUTPUT
          fi

      - name: Show Output
        run: |-
          echo "Read URL: ${{ steps.deploy.outputs.read_url }}"
          echo "Write URL: ${{ steps.deploy.outputs.write_url }}"